<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroBrowser</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.875rem;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NeuroBrowser</h1>
      <p>Welcome. Use the address bar above to open a site or search the web.</p>
      <p class="hint">Getting started — type a URL or a search query and press Enter.</p>
    </main>
  </body>
</html>
